<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="main.js" defer></script>
    <title>Gues The Number</title>
</head>
<body>
    <h1>Guess The Number</h1>
    <hr>
    <p>Guess The Number Between 0 to 100</p>
    <form>
        <input type="number" name="guess" placeholder="Enter Your Guess" min="0" max="100" required>
        <div>
            <button type="submit" class="submit-btn">Submit</button>
            <button type="button" class="restart-game-btn" disabled >Start Game</button>
        </div>
    </form>
    <p class="result"></p>
    <p class="all-guess"></p>
</body>
</html>
